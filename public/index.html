<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLE Zigbee 업그레이드</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Feature Unlock</p>
        <h1>BLE 기기에 Zigbee 기능을 추가하세요</h1>
        <p class="subtitle">
          출고 시 BLE 버전으로 판매된 기기를 유료 업그레이드하면 Zigbee 기능을 사용할 수 있습니다.
          결제가 완료되면 해당 SN의 업그레이드 구매 상태가 즉시 반영됩니다.
        </p>
        <div class="pricing-card">
          <span class="pricing-label">업그레이드 금액</span>
          <strong>¥199</strong>
          <span class="pricing-note">정보 입력 후 유료 업그레이드 결제 버튼을 누르면 Demo Checkout 창이 열립니다.</span>
        </div>
      </section>

      <section class="panel">
        <form id="upgrade-form" class="upgrade-form">
          <label class="field">
            <span>기기 SN</span>
            <input id="sn" name="sn" type="text" placeholder="예: A01460/LS1ELU01801" autocomplete="off" required />
          </label>

          <label class="field">
            <span>휴대폰 번호 또는 이메일</span>
            <input
              id="contact"
              name="contact"
              type="text"
              placeholder="예: 01012345678 / user@example.com"
              autocomplete="off"
              required
            />
          </label>

          <div id="device-summary" class="device-summary hidden"></div>

          <button id="purchase-button" class="purchase-button" type="submit">
            유료 업그레이드 결제
          </button>
        </form>

        <p id="message" class="message" aria-live="polite"></p>
      </section>
    </main>

    <div id="payment-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="payment-title">
      <div class="modal-card">
        <p class="eyebrow">Demo Checkout</p>
        <h2 id="payment-title">데모 결제</h2>
        <p class="modal-text">아래 버튼을 누르면 결제 성공을 시뮬레이션하고, 해당 SN을 Zigbee 업그레이드 완료 상태로 변경합니다.</p>
        <div class="modal-actions">
          <button id="cancel-payment" class="ghost-button" type="button">취소</button>
          <button id="confirm-payment" class="purchase-button" type="button">데모 결제 완료</button>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
